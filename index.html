<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>OBMC Enroll Now</title>
    <style>
        body {
            background-image: url(https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/9804865a-f6de-47d0-b463-c569491b9621/OBMC+MONTESSORI+FV+1+-+AY+2026+FA.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .form-box {
            background-color: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1fPjyNg5xFEOtT5wBIhcsb3H__yQMgGnnE6Y-yCOr6VzFjiJQctV9dWo&s=10" alt="OBMC Logo" width="30" height="30" class="rounded-circle bg-white me-2">
                OBMC Admissions
            </a>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Enroll Now</a>
                </li>
            </ul>
            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search">
                <button class="btn btn-primary" type="submit">Search</button>
            </form>
        </div>
    </nav>
    <div class="container text-center mt-4">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1fPjyNg5xFEOtT5wBIhcsb3H__yQMgGnnE6Y-yCOr6VzFjiJQctV9dWo&s=10" alt="OBMC Logo" width="60" height="60" class="rounded-circle bg-white mb-2">
        <h1>OBMC Student Enrollment Form</h1>
        <p>Fill out the form below to enroll for the upcoming school year.</p>
    </div>
    <div class="container mt-4 mb-5">
        <div class="form-box p-4 rounded shadow">
            <form>
                <h2 class="h4 mb-3">Student Information</h2>
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" placeholder="Name" required>
                    </div>
                    <div class="col">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" placeholder="Last name" required>
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col">
                        <label class="form-label">Birth Date</label>
                        <input type="date" class="form-control" required>
                    </div>
                    <div class="col">
                        <label class="form-label">Gender</label>
                        <select class="form-select" required>
                            <option selected disabled value="">Select...</option>
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>
                    <div class="col">
                        <label class="form-label">Grade Level</label>
                        <select class="form-select" required>
                            <option selected disabled value="">Select...</option>
                            <option>Junior Casa</option>
                            <option>Junior Advanced Casa</option>
                            <option>Advanced Casa</option>
                            <option>Grade 1</option>
                            <option>Grade 2</option>
                            <option>Grade 3</option>
                            <option>Grade 4</option>
                            <option>Grade 5</option>
                            <option>Grade 6</option>
                            <option>Grade 7</option>
                            <option>Grade 8</option>
                            <option>Grade 9</option>
                            <option>Grade 10</option>
                            <option>Grade 11</option>
                            <option>Grade 12</option>                       
                        </select>
                    </div>
                </div>
                <h2 class="h4 mb-3">Contact Details</h2>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="student@example.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Contact Number</label>
                    <input type="tel" class="form-control" placeholder="0912-345-6789" required>
                </div>
                <h2 class="h4 mb-3">Other Information</h2>
                <div class="mb-3">
                    <label class="form-label d-block">Choose Your Mode of Learning</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="mode" id="online" required>
                        <label class="form-check-label" for="online">Online learning</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="mode" id="f2f">
                        <label class="form-check-label" for="f2f">Face to Face Learning</label>
                    </div>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="confirm" required>
                    <label class="form-check-label" for="confirm">
                       My informatiom is complete and accurate
                    </label>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Submit Enrollment</button>
                </div>
            </form>
        </div>
    </div>
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Student Enrollment Page | Zeeshan M. Dalidig | 9-Jade</p>
    </footer>
</body>
</html>
